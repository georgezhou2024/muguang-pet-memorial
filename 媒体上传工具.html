<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>沐光宠语 · 媒体库</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Microsoft YaHei',sans-serif;background:#1a1a1a;color:#eee;min-height:100vh}
  .header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid #333;position:sticky;top:0;background:#1a1a1a;z-index:10}
  .logo{width:36px;height:36px;background:linear-gradient(135deg,#B8743A,#9A5D2E);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
  .header h1{font-size:18px;font-weight:600}
  .btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px}
  .btn-primary{background:#B8743A;color:#fff}
  .btn-primary:hover{background:#9A5D2E}
  .btn-ghost{background:#333;color:#ddd}
  .sidebar{position:fixed;left:0;top:65px;bottom:0;width:200px;padding:20px;border-right:1px solid #333}
  .sidebar-item{padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:#aaa;margin-bottom:4px}
  .sidebar-item:hover{background:#333}
  .sidebar-item.active{background:#2a2a2a;color:#B8743A}
  .main{margin-left:220px;padding:24px}
  .drop-zone{border:2px dashed #444;border-radius:12px;padding:30px;text-align:center;margin-bottom:24px;background:#222;cursor:pointer;transition:.2s}
  .drop-zone:hover,.drop-zone.dragover{border-color:#B8743A;background:#2a2218}
  .drop-zone p{font-size:15px;color:#888}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .card{background:#222;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .card .thumb{width:100%;height:160px;object-fit:cover;background:#333}
  .card .meta{padding:10px 12px}
  .card .name{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .size{font-size:11px;color:#666;margin-top:2px}
  .card .del{position:absolute;top:8px;right:8px;background:rgba(231,76,60,.9);color:#fff;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;opacity:0;transition:.2s}
  .card:hover .del{opacity:1}
  .progress{height:4px;background:#333;border-radius:2px;margin-bottom:16px;overflow:hidden}
  .progress-bar{height:100%;background:#B8743A;width:0;transition:.3s}
  .status{font-size:13px;color:#888}
  /* Lightbox */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center}
  .lightbox.open{display:flex}
  .lightbox img{max-width:90%;max-height:85vh;border-radius:8px}
  .lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lightbox .nav:hover{background:rgba(255,255,255,.2)}
  .lightbox .prev{left:24px}
  .lightbox .next{right:24px}
  .lightbox .close{position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer}
  .lightbox .counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#aaa;font-size:13px}
  input[type=file]{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🐾</div>
  <h1>沐光宠语 · 媒体库</h1>
  <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📷 上传照片</button>
  <span class="status" id="status">就绪</span>
</div>

<div class="sidebar">
  <div class="sidebar-item active">🖼 图片</div>
  <div class="sidebar-item">🎬 视频</div>
  <div class="sidebar-item">📊 存储空间</div>
  <div style="margin-top:20px;padding:12px;background:#222;border-radius:8px;font-size:12px;color:#666">
    拖照片到中间区域即可上传
  </div>
</div>

<div class="main">
  <div class="drop-zone" id="dropZone">
    <p>📂 把照片拖到这里上传，或点上方按钮选择文件</p>
  </div>
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="gallery" id="gallery"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLightbox()">✕</button>
  <button class="nav prev" onclick="navLightbox(-1)">‹</button>
  <img id="lbImg" src="">
  <button class="nav next" onclick="navLightbox(1)">›</button>
  <div class="counter" id="lbCounter"></div>
</div>

<input type="file" id="fileInput" multiple accept="image/*,video/*">

<script>
let items = [];
let lbIndex = 0;

// 加载已有媒体
async function loadMedia(){
  try{
    const r = await fetch('https://muguang-pet-memorial.vercel.app/api/media');
    const j = await r.json();
    items = j.files || [];
    renderGallery();
  }catch(e){
    document.getElementById('gallery').innerHTML = '<p style="color:#666">加载失败，刷新重试</p>';
  }
}

function renderGallery(){
  const g = document.getElementById('gallery');
  if(!items.length){ g.innerHTML = '<p style="color:#555;grid-column:1/-1;text-align:center;padding:40px">媒体库为空</p>'; return; }
  g.innerHTML = items.map((f,i)=>`
    <div class="card" onclick="openLightbox(${i})">
      ${f.type==='video'
        ? `<video src="${f.url}" class="thumb" muted></video>`
        : `<img src="${f.url}" class="thumb" loading="lazy">`}
      <div class="meta">
        <div class="name">${f.name}</div>
        <div class="size">${f.type==='video'?'视频':'图片'}</div>
      </div>
      <button class="del" onclick="event.stopPropagation();deleteItem(${i})">✕</button>
    </div>`).join('');
}

function openLightbox(i){
  lbIndex = i;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
function navLightbox(dir){
  lbIndex = (lbIndex + dir + items.length) % items.length;
  updateLightbox();
}
function updateLightbox(){
  const f = items[lbIndex];
  document.getElementById('lbImg').src = f.url;
  document.getElementById('lbCounter').textContent = `${lbIndex+1} / ${items.length}`;
}

async function deleteItem(i){
  if(!confirm('删除 '+items[i].name+'？')) return;
  try{
    await fetch('https://muguang-pet-memorial.vercel.app/api/delete-media',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path:'images/'+items[i].name})
    });
    items.splice(i,1);
    renderGallery();
  }catch(e){ alert('删除失败'); }
}

// 拖放上传
const dz = document.getElementById('dropZone');
dz.addEventListener('click', ()=>document.getElementById('fileInput').click());
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('dragover');
  uploadFiles(Array.from(e.dataTransfer.files));
});
document.getElementById('fileInput').addEventListener('change', e=>{
  uploadFiles(Array.from(e.target.files));
  e.target.value = '';
});

async function uploadFiles(files){
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  for(let i=0; i<files.length; i++){
    const f = files[i];
    status.textContent = `上传中 ${i+1}/${files.length}: ${f.name}`;
    bar.style.width = ((i/files.length)*100)+'%';
    try{
      const dataUrl = await readAsDataURL(f);
      const r = await fetch('https://muguang-pet-memorial.vercel.app/api/upload',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body: JSON.stringify({filename:f.name, dataUrl})
      });
      const j = await r.json();
      if(j.ok) items.unshift({name:f.name, url:j.url, type: f.type.startsWith('video')?'video':'image'});
    }catch(e){}
  }
  bar.style.width = '100%';
  status.textContent = `✅ 完成 ${files.length} 张`;
  renderGallery();
}

function readAsDataURL(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

// 键盘翻页
document.addEventListener('keydown', e=>{
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='ArrowLeft') navLightbox(-1);
  if(e.key==='ArrowRight') navLightbox(1);
  if(e.key==='Escape') closeLightbox();
});

loadMedia();
</script>
</body>
</html>
