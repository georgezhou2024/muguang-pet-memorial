<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>沐光宠语 · 媒体上传工具</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Microsoft YaHei',sans-serif;background:#1a1a2e;color:#eee;padding:20px}
  h1{font-size:20px;margin-bottom:16px;color:#B8743A}
  .toolbar{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
  button{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
  .btn-main{background:#B8743A;color:#fff}
  .btn-main:hover{background:#9A5D2E}
  .btn-ghost{background:#333;color:#eee}
  .status{font-size:14px;color:#aaa}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
  .item{background:#16213e;border-radius:8px;overflow:hidden;position:relative}
  .item img{width:100%;height:120px;object-fit:cover;display:block}
  .item .url{font-size:10px;color:#888;padding:6px;word-break:break-all;cursor:pointer}
  .item .url:hover{color:#B8743A}
  .item .check{position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
  .item.selected .check{background:#B8743A}
  .progress{height:6px;background:#333;border-radius:3px;margin:10px 0;overflow:hidden}
  .progress-bar{height:100%;background:#B8743A;width:0;transition:.3s}
  .hint{font-size:13px;color:#888;margin-bottom:16px;line-height:1.6}
  .url-list{margin-top:20px;padding:16px;background:#16213e;border-radius:8px}
  .url-list h3{font-size:14px;margin-bottom:10px;color:#B8743A}
  .url-list textarea{width:100%;height:100px;background:#0f0f23;color:#aaa;border:1px solid #333;border-radius:6px;padding:10px;font-size:12px}
</style>
</head>
<body>

<h1>📸 沐光宠语 · 批量上传照片工具</h1>
<p class="hint">
  1. 点"选择照片"从本地文件夹选多张图片（Ctrl 或 Shift 多选）<br>
  2. 点"全部上传"自动传到 GitHub<br>
  3. 上传完后点"复制链接"就能粘到后台使用
</p>

<div class="toolbar">
  <button class="btn-main" onclick="pickFiles()">📂 选择照片（可多选）</button>
  <button class="btn-main" onclick="uploadAll()">⬆️ 全部上传</button>
  <button class="btn-ghost" onclick="copyUrls()">📋 复制所有链接</button>
  <span class="status" id="status">未选择文件</span>
</div>

<div class="progress"><div class="progress-bar" id="bar"></div></div>

<div class="gallery" id="gallery"></div>

<div class="url-list">
  <h3>已上传的图片链接（点击自动复制）</h3>
  <textarea id="urlOut" readonly placeholder="上传后这里会显示所有图片链接"></textarea>
</div>

<input type="file" id="fileInput" multiple accept="image/*" style="display:none">

<script>
let files = [];
let uploaded = [];

function pickFiles(){
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function(e){
  files = Array.from(e.target.files);
  document.getElementById('status').textContent = `已选 ${files.length} 张照片，点"全部上传"开始`;
  renderGallery();
});

async function uploadAll(){
  if(!files.length){ alert('请先选择照片'); return; }
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  uploaded = [];

  for(let i=0; i<files.length; i++){
    const f = files[i];
    status.textContent = `上传中 ${i+1}/${files.length}: ${f.name}`;
    bar.style.width = ((i/files.length)*100)+'%';

    try{
      const dataUrl = await readAsDataURL(f);
      const r = await fetch('https://muguang-pet-memorial.vercel.app/api/upload',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ filename: f.name, dataUrl })
      });
      const j = await r.json();
      if(j.ok){
        uploaded.push(j.url);
      } else {
        alert('上传失败: '+f.name+' - '+(j.error||''));
      }
    }catch(e){
      alert('网络错误: '+f.name);
    }
  }
  bar.style.width = '100%';
  status.textContent = `✅ 完成！上传了 ${uploaded.length}/${files.length} 张`;
  document.getElementById('urlOut').value = uploaded.join('\n');
  renderGallery();
}

function readAsDataURL(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

function renderGallery(){
  const g = document.getElementById('gallery');
  const imgs = [...uploaded];
  // also show pending files as thumbnails
  files.forEach((f,i)=>{
    if(!uploaded[i]){
      imgs.unshift('');
    }
  });
  g.innerHTML = '';
  files.forEach((f,i)=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<img src="${URL.createObjectURL(f)}"><div class="url">${f.name}</div>`;
    g.appendChild(div);
  });
  uploaded.forEach((url,i)=>{
    const div = document.createElement('div');
    div.className = 'item selected';
    div.innerHTML = `<img src="${url}"><div class="url" onclick="navigator.clipboard.writeText('${url}');alert('已复制')">${url.split('/').pop()}</div>`;
    g.appendChild(div);
  });
}

function copyUrls(){
  if(!uploaded.length){ alert('还没上传'); return; }
  navigator.clipboard.writeText(uploaded.join('\n'));
  document.getElementById('status').textContent = '✅ 已复制到剪贴板';
}
</script>
</body>
</html>
