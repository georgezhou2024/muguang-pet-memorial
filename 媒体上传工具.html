<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>沐光宠语 · 媒体上传工具</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Microsoft YaHei',sans-serif;background:#8B6340;color:#eee;padding:20px}
  h1{font-size:20px;margin-bottom:16px;color:#FDFBF8}
  .toolbar{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
  button{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
  .btn-main{background:#B8743A;color:#fff}
  .btn-main:hover{background:#9A5D2E}
  .btn-ghost{background:#666;color:#eee}
  .status{font-size:14px;color:#ddd}
  .drop-zone{border:2px dashed #ccc;border-radius:12px;padding:40px;text-align:center;margin-bottom:20px;background:rgba(255,255,255,.05);cursor:pointer}
  .drop-zone.dragover{background:rgba(184,116,58,.2);border-color:#B8743A}
  .drop-zone p{font-size:16px;color:#ddd}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
  .item{background:#5C4028;border-radius:8px;overflow:hidden;position:relative}
  .item img{width:100%;height:120px;object-fit:cover;display:block}
  .item .url{font-size:10px;color:#aaa;padding:6px;word-break:break-all;cursor:pointer}
  .item .del{position:absolute;top:4px;right:4px;background:#e74c3c;color:#fff;border:none;border-radius:4px;width:24px;height:24px;cursor:pointer}
  .progress{height:6px;background:#5C4028;border-radius:3px;margin:10px 0;overflow:hidden}
  .progress-bar{height:100%;background:#B8743A;width:0;transition:.3s}
  .url-list{margin-top:20px;padding:16px;background:#5C4028;border-radius:8px}
  .url-list h3{font-size:14px;margin-bottom:10px;color:#B8743A}
  .url-list textarea{width:100%;height:100px;background:#3a2a1a;color:#aaa;border:1px solid #666;border-radius:6px;padding:10px;font-size:12px}
</style>
</head>
<body>

<h1>📸 沐光宠语 · 媒体上传工具</h1>
<p style="font-size:13px;color:#ddd;margin-bottom:16px">把照片直接拖到下面虚线框里，自动上传到网站媒体库。</p>

<div class="drop-zone" id="dropZone">
  <p>📂 把照片拖到这里，或点我选文件</p>
</div>

<div class="toolbar">
  <button class="btn-main" onclick="pickFiles()">📂 选择照片</button>
  <button class="btn-ghost" onclick="copyUrls()">📋 复制所有链接</button>
  <span class="status" id="status">就绪</span>
</div>

<div class="progress"><div class="progress-bar" id="bar"></div></div>

<div class="gallery" id="gallery"></div>

<div class="url-list">
  <h3>已上传的图片链接（点击自动复制）</h3>
  <textarea id="urlOut" readonly placeholder="上传后这里会显示所有图片链接"></textarea>
</div>

<input type="file" id="fileInput" multiple accept="image/*" style="display:none">

<script>
let files = [];
let uploaded = [];

const dz = document.getElementById('dropZone');
dz.addEventListener('click', ()=>document.getElementById('fileInput').click());
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('dragover');
  const dropped = Array.from(e.dataTransfer.files);
  files = files.concat(dropped);
  document.getElementById('status').textContent = `已添加 ${files.length} 张，自动上传中...`;
  uploadAll();
});

document.getElementById('fileInput').addEventListener('change', e=>{
  files = files.concat(Array.from(e.target.files));
  document.getElementById('status').textContent = `已添加 ${files.length} 张，自动上传中...`;
  uploadAll();
});

async function uploadAll(){
  if(!files.length) return;
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  for(let i=0; i<files.length; i++){
    const f = files[i];
    status.textContent = `上传中 ${i+1}/${files.length}: ${f.name}`;
    bar.style.width = ((i/files.length)*100)+'%';
    try{
      const dataUrl = await readAsDataURL(f);
      const r = await fetch('https://muguang-pet-memorial.vercel.app/api/upload',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ filename: f.name, dataUrl })
      });
      const j = await r.json();
      if(j.ok) uploaded.push(j.url);
    }catch(e){}
  }
  bar.style.width = '100%';
  status.textContent = `✅ 完成！上传了 ${uploaded.length}/${files.length} 张`;
  document.getElementById('urlOut').value = uploaded.join('\n');
  renderGallery();
}

function readAsDataURL(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

function renderGallery(){
  const g = document.getElementById('gallery');
  g.innerHTML = uploaded.map(url=>{
    const name = url.split('/').pop();
    return `<div class="item">
      <img src="${url}">
      <div class="url" onclick="navigator.clipboard.writeText('${url}');alert('已复制')">${name}</div>
    </div>`;
  }).join('');
}

function copyUrls(){
  if(!uploaded.length){ alert('还没上传'); return; }
  navigator.clipboard.writeText(uploaded.join('\n'));
  document.getElementById('status').textContent = '✅ 已复制到剪贴板';
}
</script>
</body>
</html>
